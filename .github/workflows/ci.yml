name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary pytest
      - run: python3 -m pytest semaine-02/compose/app/test_app.py -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  build:
    runs-on: ubuntu-latest
    needs: [test, sast]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t devops-app:latest ./semaine-02/compose/app

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t devops-app:latest ./semaine-02/compose/app
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-app:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
